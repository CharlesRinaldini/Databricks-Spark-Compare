# This is a Databricks asset bundle definition for edw.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: sparkcomare
  uuid: eae3660c-f0c2-433c-b00a-46a45fff8f05

include:
  - resources/variables/*.yml
  - resources/*.yml

variables:
  environment:
    default: "dv"

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-18ac467b-29cc.cloud.databricks.com
    variables:
      environment: "dv"
      
  dev-agent:
    # Schedule jobs to run in DV as agent
    mode: production
    workspace:
      host: https://dbc-18ac467b-29cc.cloud.databricks.com
      root_path: /Workspace/${bundle.name}/
    variables:
      environment: "dv"

      