# Use https://www.freeformatter.com/cron-expression-generator-quartz.html to figure out cron expressions
resources:
  jobs:
    compare_demo_job:
      name: Demo Compare Job

      email_notifications:
        on_failure:
          - rinaldini.charles@gmail.com

      tasks:
        - task_key: run_notebook
          notebook_task:
            notebook_path: ../src/comparedemo.ipynb
            source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
